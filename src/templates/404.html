{% extends 'layout.html.j2' %}

{% block title %}
  404 – Not Found
{% endblock %}

{% block content %}
  <style>
    .error-container {
      text-align: center;
    }

    .error-code {
      font-size: 6rem;
      font-weight: bold;
      color: #ccc;
      line-height: 1;
      margin: 0;
    }

    .error-title {
      font-size: 1.4rem;
      margin: 0.5rem 0 1rem;
      color: #444;
    }

    .error-message {
      color: #888;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .error-link {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      background-color: #333;
      color: #fff;
      border-radius: 6px;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .error-link:hover {
      background-color: #555;
      text-decoration: none;
    }
  </style>

  <div class="centered-content error-container">
    <p class="error-code">404</p>
    <h2 class="error-title">Page not found</h2>
    <p class="error-message">The route you're looking for doesn't exist.</p>
    <a href="/" class="error-link">← Back to Home</a>
  </div>

{% endblock %}
